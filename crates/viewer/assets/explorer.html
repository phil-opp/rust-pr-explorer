<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · Rust Semantic Review</title>
<style>
/*{{FONTS}}*/
/*{{STYLE}}*/
</style>
</head>
<body>
<header id="top">
  <div class="top-row">
    <button id="side-btn" title="Modules and files" aria-label="Modules and files">☰</button>
    <div class="brand">Rust Semantic Review</div>
    <div id="pr-title"></div>
    <div class="settings-wrap"><button id="settings-btn" title="Theme, diff layout, whitespace and code font" aria-label="Settings">⚙<span class="btn-label"> Settings</span></button><div id="settings" class="hidden"></div></div>
    <div class="search"><input id="search" type="search" placeholder="Find item…" autocomplete="off"><div id="search-results"></div></div>
  </div>
  <div class="top-row sub">
    <nav id="views">
      <button data-view="overview">Overview</button>
      <button data-view="module">Modules</button>
      <button data-view="canvas">Canvas</button>
      <button data-view="calls" title="The call graph one item at a time">Calls</button>
      <button data-view="space">Structure</button>
    </nav>
    <div id="commit-menu"></div>
    <button id="rv-mode" title="Mark items as reviewed">Start review</button>
    <div id="rv-bar"></div>
  </div>
</header>
<div id="layout">
  <aside id="sidebar"></aside>
  <button id="side-hide" title="Hide the sidebar" aria-label="Hide the sidebar">«</button>
  <button id="side-show" title="Show the sidebar" aria-label="Show the sidebar">»</button>
  <main id="main">
    <section id="view-overview" class="view page"></section>
    <section id="view-module" class="view page"></section>
    <section id="view-canvas" class="view">
      <div id="canvas-bar"></div>
      <div id="viewport">
        <div id="world"><svg id="frames"></svg><svg id="edges"></svg><div id="cards"></div></div>
        <div id="canvas-empty"></div>
      </div>
    </section>
    <section id="view-calls" class="view page"></section>
    <section id="view-space" class="view">
      <div id="space-bar"></div>
      <div id="space-alt"></div>
    </section>
  </main>
</div>
<div id="tooltip"></div>
<div id="toast"></div>
<div id="modal" class="hidden"><div id="modal-box"><div id="modal-h"><span id="modal-title"></span><span class="x" data-modal-close title="Close (Esc)">×</span></div><div id="modal-b"></div></div></div>
<script id="data" type="application/gzip">{{DATA}}</script>
<script type="module">
// Generated by wasm-bindgen: loads the viewer, which is written in Rust.
/*{{GLUE}}*/
// The wasm and the data are gzipped and base64 encoded (see `render_page`).
// Fetching a data URL decodes base64 natively, much faster than `atob` and
// a loop over its characters.
const gunzip = async (base64, type) => {
  const packed = await fetch(`data:application/gzip;base64,${base64}`);
  const stream = packed.body.pipeThrough(new DecompressionStream("gzip"));
  return new Response(stream, { headers: { "Content-Type": type } });
};
// Compiled while the data is unpacked.
const viewer = gunzip("{{WASM}}", "application/wasm").then(WebAssembly.compileStreaming);
const data = document.getElementById("data");
const json = await gunzip(data.textContent, "application/json").then((r) => r.text());
// The viewer reads the analysis from here.
data.textContent = json;
await __wbg_init({ module_or_path: await viewer });
</script>
</body>
</html>
