<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · Rust PR Explorer</title>
<style>
/*{{FONTS}}*/
/*{{STYLE}}*/
</style>
</head>
<body>
<header id="top">
  <div class="brand">Rust PR Explorer</div>
  <div id="pr-title"></div>
  <nav id="views">
    <button data-view="overview">Overview</button>
    <button data-view="module">Modules</button>
    <button data-view="canvas">Canvas</button>
    <button data-view="space">Structure</button>
  </nav>
  <button id="rv-mode" title="Review mode: mark items and files as reviewed, one by one">Start review</button>
  <div id="rv-bar"></div>
  <div class="settings-wrap"><button id="settings-btn" title="Diff layout, whitespace and code font">⚙ Settings</button><div id="settings" class="hidden"></div></div>
  <div class="search"><input id="search" type="search" placeholder="Find item…" autocomplete="off"><div id="search-results"></div></div>
</header>
<div id="layout">
  <aside id="sidebar"></aside>
  <main id="main">
    <section id="view-overview" class="view page"></section>
    <section id="view-module" class="view page"></section>
    <section id="view-canvas" class="view">
      <div id="canvas-bar"></div>
      <div id="viewport">
        <div id="world"><svg id="frames"></svg><svg id="edges"></svg><div id="cards"></div></div>
        <div id="canvas-empty"></div>
      </div>
    </section>
    <section id="view-space" class="view">
      <div id="space-bar"></div>
      <div id="space-alt"></div>
    </section>
  </main>
</div>
<div id="tooltip"></div>
<div id="toast"></div>
<div id="modal" class="hidden"><div id="modal-box"><div id="modal-h"><span id="modal-title"></span><span class="x" data-modal-close title="Close (Esc)">×</span></div><div id="modal-b"></div></div></div>
<script id="data" type="application/json">/*{{DATA}}*/</script>
<script type="module">
// Generated by wasm-bindgen: loads the viewer, which is written in Rust.
/*{{GLUE}}*/
const viewerWasm = Uint8Array.from(atob("{{WASM}}"), (c) => c.charCodeAt(0));
await __wbg_init({ module_or_path: viewerWasm });
</script>
</body>
</html>
