[package]
name = "viewer"
description = "The review page's front end, compiled to WebAssembly"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
model.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
js-sys = "0.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
web-sys = { version = "0.3", features = [
  "AddEventListenerOptions",
  "Clipboard",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "DomRectList",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "HtmlDetailsElement",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "KeyboardEvent",
  "Location",
  "MouseEvent",
  "Navigator",
  "Node",
  "NodeList",
  "Performance",
  "PointerEvent",
  "Range",
  "ResizeObserver",
  "ResizeObserverEntry",
  "ScrollBehavior",
  "ScrollIntoViewOptions",
  "ScrollLogicalPosition",
  "Storage",
  "WheelEvent",
  "Window",
] }
similar = { version = "3.2.1", default-features = false, features = ["std"] }

[lints]
workspace = true
