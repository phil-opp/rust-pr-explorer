name: Rust Semantic Review

# Builds the review page for every pull request and links it in a comment.
# Uses the action from the PR's own checkout, so a PR that changes the tool
# shows itself with its own version.
#
# In trusted mode: the PR's build scripts and proc macros run, as they do in
# CI's `cargo test`. Under `pull_request`, a PR from a fork gets a read-only
# token and no secrets, and a PR from a branch here is by someone who can
# push anyway.
on:
  pull_request:
  # Only builds and caches the tool and the analysis' target directory:
  # caches saved on `main` are the ones every pull request can read.
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  # Only to show in the comment when the pages expire.
  actions: read

# A new push to a PR cancels the PR's running job. Runs on `main` are never
# cancelled: when merges come faster than a cold build (about 7 minutes),
# each one would cancel the previous, and the cache would never be saved.
# They queue instead, and a newer queued run replaces an older one.
concurrency:
  group: rust-semantic-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  explore:
    runs-on: ubuntu-latest
    env:
      # The analysis doesn't need the viewer's wasm build (see build.rs).
      RUST_SEMANTIC_REVIEW_STUB_VIEWER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          trust-project-code: true
