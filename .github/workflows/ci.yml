name: CI

on:
  # Pull requests run on `pull_request`; `push` only for `main`, so that a
  # push to a PR branch doesn't run the job twice.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy, rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p viewer --target wasm32-unknown-unknown -- -D warnings
      - run: cargo check -p rust-pr-explorer --no-default-features
      - run: cargo test --workspace
      - run: cargo run --release -- dirs fixtures/demo/base fixtures/demo/head -o demo.html
