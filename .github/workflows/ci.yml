name: CI

on:
  # Pull requests run on `pull_request`; `push` only for `main`, so that a
  # push to a PR branch doesn't run the job twice.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy, rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p viewer --target wasm32-unknown-unknown -- -D warnings
      - run: cargo check -p semantic-review --no-default-features
      - run: cargo test --workspace
      - run: cargo run --release -- dirs fixtures/demo/base fixtures/demo/head -o demo.html
      # Headless browser smoke test: every view of the demo page, in the
      # light and the dark theme, with a WCAG AA text contrast check. The page and the screenshots are uploaded,
      # so that the viewer can be looked at without building it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.63.0 axe-core@4.10.2
      - run: npx playwright install --with-deps chromium
      - run: node ci/smoke.mjs demo.html smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-page
          path: |
            demo.html
            smoke/
          if-no-files-found: warn
