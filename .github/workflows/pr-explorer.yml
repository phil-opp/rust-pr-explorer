name: PR Explorer

# Builds the explorer page for every pull request and links it in a comment.
# Uses the action from the PR's own checkout, so a PR that changes the tool
# shows itself with its own version.
on:
  pull_request:
  # Only builds and caches the tool: caches saved on `main` are the ones
  # every pull request can read.
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# A new push to a PR cancels the PR's running job. Runs on `main` are never
# cancelled: when merges come faster than a cold build (about 7 minutes),
# each one would cancel the previous, and the cache would never be saved.
# They queue instead, and a newer queued run replaces an older one.
concurrency:
  group: pr-explorer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
