name: Rebase needed

# Leaves a review on every open pull request that has merge conflicts with its
# base branch, asking for a rebase. The review is posted once per conflict:
# while the PR stays in conflict, later runs leave it alone. Once the
# conflicts are gone, the review's text is edited to say so, the review is
# hidden as resolved, and the `rebase-needed` label is removed. If the PR runs
# into conflicts again later, it gets a new, visible review.
#
# A push to `main` can put any open PR in conflict, so it checks all of them.
# A push to a PR from a branch of this repository (or a change of its base
# branch) checks only that PR, so a resolved conflict is noticed right away.
#
# PRs from forks get a read-only token on `pull_request`, so they are skipped
# there and covered by the hourly scheduled run instead, which also checks
# all open PRs. That run also catches PRs whose mergeability GitHub had not
# computed yet when an earlier run looked at them.
#
# This used `pull_request_target` before, which gives a write token also for
# forks, but GitHub restricts that trigger on public repositories by default.
# Scheduled runs only happen on the default branch, and GitHub pauses them
# after 60 days without activity in the repository.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

# One run at a time, so two runs can't both see "no review yet" and both post
# one. Runs queue instead of cancelling each other.
concurrency:
  group: rebase-needed
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # `edited` also fires for title and description edits: only a change of
    # the base branch can change whether the PR has conflicts. PRs from forks
    # can't write reviews or labels here; the scheduled run covers them.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.action != 'edited' || github.event.changes.base != null))
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const MARKER_OPEN = '<!-- rebase-needed:conflict -->';
            const MARKER_DONE = '<!-- rebase-needed:resolved -->';
            const LABEL = 'rebase-needed';
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            // GitHub computes `mergeable` in the background, and after a push
            // to the base branch it is `null` until that is done. Fetching
            // the PR starts the computation; poll until there is a result.
            async function fetchMergeable(number) {
              for (let attempt = 0; attempt < 12; attempt++) {
                const { data: pr } = await github.rest.pulls.get({
                  owner, repo, pull_number: number,
                });
                if (pr.state !== 'open') return { pr, mergeable: null };
                if (pr.mergeable !== null) return { pr, mergeable: pr.mergeable };
                await sleep(5000);
              }
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: number,
              });
              return { pr, mergeable: pr.mergeable };
            }

            // Adding a label that doesn't exist would create it in gray;
            // create it once with a color that stands out in the PR list.
            let labelReady = false;
            async function ensureLabel() {
              if (labelReady) return;
              try {
                await github.rest.issues.getLabel({ owner, repo, name: LABEL });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({
                  owner, repo, name: LABEL, color: 'd93f0b',
                  description: 'Has merge conflicts with its base branch',
                });
              }
              labelReady = true;
            }

            async function check(number) {
              const { pr, mergeable } = await fetchMergeable(number);
              if (pr.state !== 'open') return;
              if (mergeable === null) {
                core.warning(`#${number}: GitHub did not report whether it can be merged; skipped until the next run.`);
                return;
              }
              // `mergeable` is false only for conflicts; failing checks or
              // missing reviews show up in `mergeable_state`, not here.
              const conflicting = mergeable === false;

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: number, per_page: 100,
              });
              const open = reviews.filter(
                (r) => r.user?.login === 'github-actions[bot]' && r.body?.includes(MARKER_OPEN),
              );
              const hasLabel = pr.labels.some((l) => l.name === LABEL);

              if (conflicting) {
                if (open.length === 0) {
                  const body = [
                    MARKER_OPEN,
                    `This pull request has merge conflicts with \`${pr.base.ref}\`. ` +
                      `Please rebase it onto the latest \`${pr.base.ref}\` and resolve the conflicts.`,
                    '',
                    `_Checked at head ${pr.head.sha.slice(0, 7)} against ` +
                      `\`${pr.base.ref}\` at ${pr.base.sha.slice(0, 7)}. ` +
                      'This review is updated once the conflicts are resolved._',
                  ].join('\n');
                  await github.rest.pulls.createReview({
                    owner, repo, pull_number: number, event: 'COMMENT', body,
                    commit_id: pr.head.sha,
                  });
                  core.info(`#${number}: has conflicts, review posted.`);
                } else {
                  core.info(`#${number}: has conflicts, already reviewed.`);
                }
                if (!hasLabel) {
                  await ensureLabel();
                  await github.rest.issues.addLabels({
                    owner, repo, issue_number: number, labels: [LABEL],
                  });
                }
              } else {
                for (const review of open) {
                  // Collapse the review in the timeline. If that fails, the
                  // review is still edited and the label removed below, so
                  // the PR doesn't look conflicting; it only warns.
                  try {
                    await github.graphql(
                      `mutation($id: ID!) {
                        minimizeComment(input: { subjectId: $id, classifier: RESOLVED }) {
                          minimizedComment { isMinimized }
                        }
                      }`,
                      { id: review.node_id },
                    );
                  } catch (e) {
                    core.warning(`#${number}: could not hide review ${review.id}: ${e.message}`);
                  }
                  const body = [
                    MARKER_DONE,
                    `**Resolved:** the conflicts with \`${pr.base.ref}\` are gone ` +
                      `as of head ${pr.head.sha.slice(0, 7)}.`,
                    '',
                    '<details><summary>Original review</summary>',
                    '',
                    review.body.replace(MARKER_OPEN, '').trim(),
                    '',
                    '</details>',
                  ].join('\n');
                  await github.rest.pulls.updateReview({
                    owner, repo, pull_number: number, review_id: review.id, body,
                  });
                }
                if (hasLabel) {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: number, name: LABEL,
                  });
                }
                core.info(`#${number}: no conflicts` + (open.length ? ', review marked resolved and hidden.' : '.'));
              }
            }

            let numbers;
            if (context.eventName === 'pull_request') {
              numbers = [context.payload.pull_request.number];
            } else {
              const prs = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', per_page: 100,
              });
              numbers = prs.map((p) => p.number);
              // Fetching a PR starts GitHub's mergeability computation. Do it
              // for all of them first, so they compute in parallel instead of
              // one after the other while `check` polls each in turn.
              for (const number of numbers) {
                await github.rest.pulls.get({ owner, repo, pull_number: number });
              }
            }

            let failed = false;
            for (const number of numbers) {
              try {
                await check(number);
              } catch (e) {
                failed = true;
                core.error(`#${number}: ${e.message}`);
              }
            }
            if (failed) core.setFailed('Some pull requests could not be checked.');
