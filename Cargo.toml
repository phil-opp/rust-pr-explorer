[workspace]
resolver = "3"
members = ["crates/model", "crates/rust-pr-explorer", "crates/viewer"]
exclude = ["fixtures"]
default-members = ["crates/model", "crates/rust-pr-explorer"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
model = { path = "crates/model" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The viewer and the bindgen step in the CLI's build script must use the
# exact same wasm-bindgen version.
wasm-bindgen = "=0.2.130"
wasm-bindgen-cli-support = "=0.2.130"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release.package.viewer]
opt-level = "s"
codegen-units = 1
