[workspace]
resolver = "3"
members = ["crates/model", "crates/rust-semantic-review", "crates/viewer"]
exclude = ["fixtures"]
default-members = ["crates/model", "crates/rust-semantic-review"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
model = { path = "crates/model" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The viewer and the bindgen step in the CLI's build script must use the
# exact same wasm-bindgen version.
wasm-bindgen = "=0.2.130"
wasm-bindgen-cli-support = "=0.2.130"
# The page embeds its wasm and data gzipped (see `render_page`).
flate2 = "1.1"

[workspace.lints.rust]
unsafe_code = "forbid"

# The viewer's wasm, built by the CLI's build script. A profile of its own,
# so that link-time optimization doesn't slow down the CLI's release build.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
codegen-units = 1
lto = true

# Used by the GitHub Action (`action.yml`), which builds the tool on every
# run that can't reuse a cached binary. Dependencies (rust-analyzer, syn, …)
# are optimized as in `release` and come from the cache; the workspace's own
# crates, rebuilt on each run, are not optimized. That builds them in about
# two thirds of the time, and the analysis is as fast as with `release`.
[profile.action]
inherits = "release"

[profile.action.package.rust-semantic-review]
opt-level = 0

[profile.action.package.model]
opt-level = 0
