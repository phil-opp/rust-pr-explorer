[workspace]
resolver = "3"
members = ["crates/model", "crates/rust-semantic-review", "crates/viewer"]
exclude = ["fixtures"]
default-members = ["crates/model", "crates/rust-semantic-review"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
model = { path = "crates/model" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The viewer and the bindgen step in the CLI's build script must use the
# exact same wasm-bindgen version.
wasm-bindgen = "=0.2.130"
wasm-bindgen-cli-support = "=0.2.130"
# The page embeds its wasm and data gzipped (see `render_page`).
flate2 = "1.1"

[workspace.lints.rust]
unsafe_code = "forbid"

# The viewer's wasm, built by the CLI's build script. A profile of its own,
# so that link-time optimization doesn't slow down the CLI's release build.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
codegen-units = 1
lto = true

# Used by the GitHub Action (`action.yml`), which builds the tool once per
# version and caches the binary, so a slower build pays off: on a large
# workspace (dora, 4 cores), fat LTO and one codegen unit make the analysis
# about 9% faster than `release`, for a cold build of about 7 instead of 4.5
# minutes. The tool's own crates used to be left unoptimized here, which
# saved about 20 s of the build but made the analysis about 15% slower.
[profile.action]
inherits = "release"
lto = "fat"
codegen-units = 1
