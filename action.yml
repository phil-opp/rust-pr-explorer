name: Rust PR Explorer
description: >-
  Builds the Rust PR Explorer page for a pull request, uploads it as a
  workflow artifact that opens in the browser, and links it in a PR comment.
branding:
  icon: git-pull-request
  color: orange

inputs:
  github-token:
    description: >-
      Token for cloning the repository, reading the PR's title, branches and
      review threads, and writing the comment. Needs `contents: read`,
      `pull-requests: read` for the review threads, and `pull-requests: write`
      for the comment.
    default: ${{ github.token }}
  pr:
    description: >-
      The pull request number. Defaults to the PR that triggered the
      workflow. Without one (e.g. on a push), the action only builds and
      caches the tool.
    default: ${{ github.event.pull_request.number }}
  repository:
    description: The repository of the pull request, as OWNER/REPO.
    default: ${{ github.repository }}
  comment:
    description: >-
      Post a comment on the PR that links the page. Every push that changes
      the PR gets a new comment, which also links a page of the changes
      since the previous comment's commit; a push that only merges the base
      branch or rebases onto it updates the previous comment. With `false`,
      the link is only in the job summary.
    default: "true"
  syntax-only:
    description: Skip rust-analyzer (faster, but method calls stay unresolved).
    default: "false"
  cache:
    description: >-
      Use the Actions cache: for the built tool (about 12 MB) and, with
      `save-cache`, for the build's dependencies (about 200 MB). With
      `false`, nothing is read from or written to the cache, and every run
      builds the tool from scratch (about 7 minutes).
    default: "true"
  save-cache:
    description: >-
      Save the cache of the build's dependencies (when `cache` is on). By
      default only on the default branch, where every pull request can read
      it. With `false`, only the built tool is cached.
    default: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
  retention-days:
    description: Days to keep the page. Empty uses the repository's setting (90 days by default).
    default: ""

outputs:
  page-url:
    description: URL of the uploaded page (needs a GitHub login with access to the repository).
    value: ${{ steps.upload.outputs.artifact-url }}
  page-path:
    description: Local path of the generated page.
    value: ${{ steps.run.outputs.page }}
  since-page-url:
    description: >-
      URL of the uploaded page of the changes since the previous explorer
      comment's commit; empty if there is none.
    value: ${{ steps.upload-since.outputs.artifact-url }}

runs:
  using: composite
  steps:
    # rust-analyzer needs cargo and the standard library's source, also when
    # the tool itself comes from the cache.
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
        components: rust-src
    # The built tool is cached under a hash of its sources, so a run whose
    # tool sources are unchanged (every run in a repository that only uses
    # the action) skips the build.
    - name: Hash the tool's sources
      id: key
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        hash=$(find Cargo.toml Cargo.lock crates -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-20)
        echo "key=rust-pr-explorer-bin-$RUNNER_OS-$RUNNER_ARCH-$hash" >> "$GITHUB_OUTPUT"
        echo "dir=$RUNNER_TEMP/rust-pr-explorer-bin" >> "$GITHUB_OUTPUT"
    - name: Restore the built tool
      id: bin
      if: inputs.cache == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
    # Otherwise build it. Dependencies come from rust-cache. Caches are
    # scoped to a branch, and a pull request can read those of its base
    # branch, so they are only saved there (see `save-cache`): one cache
    # that every PR starts from, instead of one per PR evicting the others.
    - uses: Swatinem/rust-cache@v2
      if: inputs.cache == 'true' && steps.bin.outputs.cache-hit != 'true'
      with:
        workspaces: ${{ github.action_path }} -> target
        shared-key: rust-pr-explorer
        # Keeps the build script's output, which holds the viewer's own
        # wasm build and its dependencies.
        cache-workspace-crates: true
        save-if: ${{ inputs.save-cache }}
    - name: Build rust-pr-explorer
      if: steps.bin.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        DIR: ${{ steps.key.outputs.dir }}
      run: |
        # See `[profile.action]` in Cargo.toml.
        cargo build --profile action --locked -p rust-pr-explorer
        mkdir -p "$DIR"
        cp target/action/rust-pr-explorer "$DIR/"
    - name: Cache the built tool
      if: inputs.cache == 'true' && steps.bin.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
    - name: Analyze the pull request
      id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ inputs.pr }}
        REPO: ${{ inputs.repository }}
        COMMENT: ${{ inputs.comment }}
        SYNTAX_ONLY: ${{ inputs.syntax-only }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        TOOL: ${{ steps.key.outputs.dir }}/rust-pr-explorer
      run: |
        if [ -z "$PR" ]; then
          # E.g. a push to the default branch, run to fill the caches.
          echo "::notice::No pull request: the tool is built and cached, nothing else to do."
          exit 0
        fi
        dir="$RUNNER_TEMP/rust-pr-explorer"
        mkdir -p "$dir"

        # The latest explorer comment on the PR, if any, says which commit
        # it showed: the page of the changes since then starts there.
        # Only comments by the workflow's bot or by people with write
        # access count, so that nobody else can pick that commit (or the
        # links that are carried over from it).
        prev=
        if [ "$COMMENT" = "true" ]; then
          gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '
            .[]
            | select(.body | startswith("<!-- rust-pr-explorer"))
            | select(.user.login == "github-actions[bot]"
                or (.author_association | IN("OWNER", "MEMBER", "COLLABORATOR")))
            | {id, body} | @json' > "$dir/comments.jsonl" \
            || echo "::warning::Could not read the PR's comments: every run posts a new one, without the changes since the last"
          if [ -s "$dir/comments.jsonl" ]; then
            tail -n1 "$dir/comments.jsonl" | jq -r '.body' > "$dir/previous.md"
            tail -n1 "$dir/comments.jsonl" | jq -r '.id' > "$dir/previous-id"
            # `<!-- rust-pr-explorer {…} -->`, else a comment from before
            # that, which names its commit as "built for <sha>".
            state=$(sed -n '1s/^<!-- rust-pr-explorer \({.*}\) -->$/\1/p' "$dir/previous.md")
            if [ -n "$state" ] && jq -e . <<< "$state" > /dev/null 2>&1; then
              printf '%s' "$state" > "$dir/previous.json"
              prev=$(jq -r '.head // ""' <<< "$state")
            else
              echo '{}' > "$dir/previous.json"
              prev=$(grep -oE 'built for [0-9a-f]{40}' "$dir/previous.md" | head -n1 | cut -c11-)
            fi
            if ! [[ "$prev" =~ ^[0-9a-f]{40}$ ]]; then prev=; fi
          fi
        fi

        # The tool clones the repository itself. Authenticate that clone for
        # this step only (private repositories), the way actions/checkout
        # does, without writing the token to any git config file.
        auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
        echo "::add-mask::$auth"
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
        export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"

        short=${HEAD_SHA:0:7}
        # The artifact is named after the file, so the name must be unique
        # per run.
        page="$dir/pr-explorer-${PR}${short:+-$short}.html"
        args=()
        if [ "$SYNTAX_ONLY" = "true" ]; then args+=(--syntax-only); fi
        if [ -n "$prev" ] && [ "$prev" != "$HEAD_SHA" ]; then args+=(--since "$prev"); fi
        # The PR's code is never built or run (no --trust-project-code):
        # the token is in this step's environment.
        "$TOOL" pr "$REPO#$PR" -o "$page" --json "$dir/analysis.json" "${args[@]}" > "$dir/stdout"
        since=$(sed -n 's/^since: //p' "$dir/stdout" | tail -n1)

        # A one-line summary for the comment: changed items (not modules),
        # how many of them are public, and changed files.
        summarize() {
          jq -r '
            [.items[] | select(.kind != "mod" and .status != "unchanged")] as $c
            | ($c | map(select(.status == "added")) | length) as $a
            | ($c | map(select(.status == "changed")) | length) as $ch
            | ($c | map(select(.status == "removed")) | length) as $r
            | ($c | map(select((.public_paths // []) | length > 0)) | length) as $p
            | (.files | length) as $f
            | if ($c | length) == 0 then "No Rust items changed; \($f) changed files."
              else "\($c | length) changed items (\($a) added, \($ch) changed, \($r) removed), \($p) of them public, in \($f) changed files."
              end
          ' "$1"
        }
        {
          echo "page=$page"
          echo "summary=$(summarize "$dir/analysis.json")"
          echo "head=$(jq -r '.meta.pr.head_commit // ""' "$dir/analysis.json")"
          echo "previous=$prev"
          # `changes`, `none` or `unavailable (why)`; empty without --since.
          echo "since=$since"
          if [ "$since" = "changes" ]; then
            echo "since-page=${page%.html}-since.html"
            echo "since-summary=$(summarize "$dir/analysis-since.json")"
          fi
          if [ -f "$dir/previous-id" ]; then
            echo "previous-id=$(cat "$dir/previous-id")"
            echo "previous-state=$(cat "$dir/previous.json")"
          fi
        } >> "$GITHUB_OUTPUT"
    - name: Upload the page
      id: upload
      if: steps.run.outputs.page != ''
      uses: actions/upload-artifact@v7
      with:
        path: ${{ steps.run.outputs.page }}
        # A single unzipped file: GitHub shows it directly in the browser.
        # The page is self-contained (styles, script, wasm and data inline).
        archive: false
        retention-days: ${{ inputs.retention-days }}
    - name: Upload the page of the changes since the last comment
      id: upload-since
      if: steps.run.outputs.since-page != ''
      uses: actions/upload-artifact@v7
      with:
        path: ${{ steps.run.outputs.since-page }}
        archive: false
        retention-days: ${{ inputs.retention-days }}
    - name: Link the page
      if: steps.run.outputs.page != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ inputs.pr }}
        REPO: ${{ inputs.repository }}
        COMMENT: ${{ inputs.comment }}
        URL: ${{ steps.upload.outputs.artifact-url }}
        SUMMARY: ${{ steps.run.outputs.summary }}
        HEAD: ${{ steps.run.outputs.head }}
        PREVIOUS: ${{ steps.run.outputs.previous }}
        PREVIOUS_ID: ${{ steps.run.outputs.previous-id }}
        PREVIOUS_STATE: ${{ steps.run.outputs.previous-state }}
        SINCE: ${{ steps.run.outputs.since }}
        SINCE_URL: ${{ steps.upload-since.outputs.artifact-url }}
        SINCE_SUMMARY: ${{ steps.run.outputs.since-summary }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        # A new comment for every push that changed the PR, with the
        # changes since the previous comment's commit. A push that only
        # merged the base branch or rebased onto it (and a re-run) updates
        # the previous comment instead, which keeps its "since" link.
        if [ -n "$PREVIOUS_ID" ] && { [ "$SINCE" = "none" ] || [ "$PREVIOUS" = "$HEAD" ]; }; then
          mode=update
          since=$(jq -c '.since // empty' <<< "$PREVIOUS_STATE")
        else
          mode=new
          since=
          if [ "$SINCE" = "changes" ]; then
            since=$(jq -nc --arg from "$PREVIOUS" --arg to "$HEAD" --arg url "$SINCE_URL" \
              --arg summary "$SINCE_SUMMARY" '{$from, $to, $url, $summary}')
          fi
        fi
        state=$(jq -nc --arg head "$HEAD" --argjson since "${since:-null}" \
          '{$head} + (if $since then {$since} else {} end)')
        body="<!-- rust-pr-explorer $state -->
        ### Rust PR Explorer

        - **[All changes]($URL)** up to \`${HEAD:0:7}\`: $SUMMARY"
        if [ -n "$since" ]; then
          from=$(jq -r '.from' <<< "$since")
          to=$(jq -r '.to' <<< "$since")
          upto=
          if [ "$to" != "$HEAD" ]; then upto=" up to \`${to:0:7}\`"; fi
          body="$body
        - **[Changes since \`${from:0:7}\`]($(jq -r '.url' <<< "$since"))**$upto: $(jq -r '.summary' <<< "$since")

        \`${from:0:7}\` is the commit the previous explorer comment showed. What the base branch changed since then (merged in or rebased onto) is left out."
        elif [ "$mode" = new ] && [[ "$SINCE" == unavailable* ]]; then
          body="$body
        - The changes since \`${PREVIOUS:0:7}\`, the commit the previous explorer comment showed, could not be shown ${SINCE#unavailable }."
        fi
        if [ "$mode" = update ] && [ "$PREVIOUS" != "$HEAD" ]; then
          body="$body

        Updated for \`${HEAD:0:7}\`, which only merged the base branch or was rebased onto it."
        fi
        body="$body

        Built by [this run]($RUN_URL). The links need a GitHub login with access to this repository, and they expire with the run's artifacts."
        {
          echo "### Rust PR Explorer"
          echo
          echo "[Open the page]($URL): $SUMMARY"
          if [ -n "$SINCE_URL" ]; then
            echo
            echo "[Changes since ${PREVIOUS:0:7}]($SINCE_URL): $SINCE_SUMMARY"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$COMMENT" != "true" ]; then exit 0; fi
        if [ "$mode" = update ]; then
          result=$(gh api -X PATCH "repos/$REPO/issues/comments/$PREVIOUS_ID" -f body="$body" 2>&1) || failed=1
        else
          result=$(gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" 2>&1) || failed=1
        fi
        if [ -n "${failed:-}" ]; then
          # E.g. a PR from a fork, whose token is read-only.
          echo "::warning::Could not comment on the PR (does the token have pull-requests: write?): $result"
        fi
