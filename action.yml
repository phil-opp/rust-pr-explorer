name: Rust Semantic Review
description: >-
  Builds the Rust Semantic Review page for a pull request and links it in a
  PR comment. The page is stored as an artifact of the workflow run: opening
  it needs a GitHub login with access to the repository, and it expires with
  the run's artifacts.
branding:
  icon: git-pull-request
  color: orange

inputs:
  github-token:
    description: >-
      Token for cloning the repository, reading the PR's title, branches,
      review threads and reviews (for the review marks saved in them), and
      writing the comment. Needs `contents: read`, `pull-requests: read` for
      the review threads and reviews, and `pull-requests: write` for the
      comment.
    default: ${{ github.token }}
  pr:
    description: >-
      The pull request number. Defaults to the PR that triggered the
      workflow. Without one (e.g. on a push), the action only builds and
      caches the tool.
    default: ${{ github.event.pull_request.number }}
  repository:
    description: The repository of the pull request, as OWNER/REPO.
    default: ${{ github.repository }}
  comment:
    description: >-
      Post a comment on the PR that links the page and lists the PR's
      breaking changes, if any. Every push that changes
      the PR gets a new comment, which also links a page of the changes
      since the previous comment's commit; a push that only merges the base
      branch or rebases onto it updates the previous comment. If the token
      can't comment (on PRs from forks and by Dependabot it is read-only),
      the data for the comment is uploaded as the
      `rust-semantic-review-comment` artifact instead, and a workflow
      triggered by `workflow_run` can post it with the comment-only action
      `phil-opp/rust-semantic-review/comment` (see the README). With
      `workflow-run`, this run never comments and always uploads the data,
      so it only needs `pull-requests: read`. With `false`, the link is
      only in the job summary.
    default: "true"
  update-comment:
    description: >-
      Keep one comment per pull request and update it on every push,
      instead of posting a new comment for every push that changes the PR
      and hiding the previous one. Nobody is notified of an update, and
      the comment stays where it was first posted in the conversation. It
      links the pages of the current push; the pages of up to 10 earlier
      pushes are listed in a folded "Earlier pushes" section. When a
      `workflow_run` workflow posts the comments, set the same input on
      the comment-only action there.
    default: "false"
  syntax-only:
    description: Skip rust-analyzer (faster, but method calls stay unresolved).
    default: "false"
  semver-checks:
    description: >-
      Also run cargo-semver-checks, which catches breaking changes the
      definitions alone don't show (auto traits such as `Send`, derived
      impls, …). It builds both versions' docs, which runs the PR's build
      scripts and procedural macros. Off by default: it adds two builds of
      the PR's crates and their dependencies to every run. Refused under
      `pull_request_target`, where the PR's code would run with the base
      repository's permissions.
    default: "false"
  trust-project-code:
    description: >-
      Let rust-analyzer run the PR's build scripts and procedural macros, so
      that calls into generated code resolve too. This runs the PR's code
      with the job's token, like a CI job that runs the PR's tests does.
      `auto` (the default) turns it on under `pull_request`, whose token is
      read-only on PRs from forks, and off when another event analyzes a PR
      (e.g. `workflow_dispatch` with `pr`). Under `pull_request_target`,
      whose token can write and which has the repository's secrets also on
      PRs from forks, an explicit `true` is refused.
      Without a cached target directory (see `cache-target`), trusted runs
      build the PR's dependencies' build scripts and proc macros every time.
    default: auto
  cache-target:
    description: >-
      In trusted mode, also cache the analysis' cargo target directory,
      saved where `save-cache` says; on a push without a PR, the action
      fills it from the checked out repository. Makes trusted
      runs much faster, but the cache can be several GB for a large
      workspace, out of the repository's 10 GB of cache storage.
    default: "false"
  cache:
    description: >-
      Use the Actions cache for the built tool (about 10 MB), keyed by the
      tool's sources, so the tool is only built once per version (about 7
      minutes). With `false`, nothing is read from or written to the cache,
      and every run builds the tool from scratch.
    default: "true"
  cache-dependencies:
    description: >-
      Also cache the build's dependencies (about 200 MB, when `cache` is
      on), so that a new version of the tool builds only its own crates
      (the dependencies, mainly rust-analyzer, take about 5 minutes). Off
      by default: the tool is built rarely, and the cache takes a share
      of the repository's 10 GB of cache storage. Saved where `save-cache`
      says.
    default: "false"
  save-cache:
    description: >-
      Where to save the caches of the build's dependencies (with
      `cache-dependencies`) and of the analysis' target directory (with
      `cache-target`). By default only on the default branch, where every
      pull request can read them. The built tool is cached on every branch
      that builds it.
    default: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
  retention-days:
    description: Days to keep the page. Empty uses the repository's setting (90 days by default).
    default: ""
  reuse-analysis:
    description: >-
      Reuse the previous run's analysis of its head for the page of the
      changes since the previous comment, instead of analyzing that commit
      again, which takes as long as analyzing the head. Each run saves its
      analysis as the `rust-semantic-review-analysis` artifact (kept like
      the pages, see `retention-days`), and the next run downloads it,
      which needs `actions: read`. It is only used if it is of the same
      tree and was made by the same build of the tool with the same
      settings and toolchain, and, for a PR from a fork, only if this run
      trusts the project code: a fork's `pull_request` runs use the fork's
      workflow, so it controls their artifacts. Otherwise, and if
      anything goes wrong, that commit is analyzed again.
    default: "true"

outputs:
  page-url:
    description: URL of the uploaded page (needs a GitHub login with access to the repository).
    value: ${{ steps.upload.outputs.artifact-url }}
  page-path:
    description: Local path of the generated page.
    value: ${{ steps.run.outputs.page }}
  since-page-url:
    description: >-
      URL of the uploaded page of the changes since the previous Rust Semantic
      Review comment's commit; empty if there is none.
    value: ${{ steps.upload-since.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - name: Check the inputs
      id: check
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        TRUST: ${{ inputs.trust-project-code }}
        SEMVER_CHECKS: ${{ inputs.semver-checks }}
        PR: ${{ inputs.pr }}
        COMMENT: ${{ inputs.comment }}
        UPDATE_COMMENT: ${{ inputs.update-comment }}
      run: |
        case "$COMMENT" in
          true | false | workflow-run) ;;
          *) echo "::error::comment must be true, false or workflow-run, not '$COMMENT'"; exit 1 ;;
        esac
        case "$UPDATE_COMMENT" in
          true | false) ;;
          *) echo "::error::update-comment must be true or false, not '$UPDATE_COMMENT'"; exit 1 ;;
        esac
        case "$TRUST" in
          true | false | auto) ;;
          *) echo "::error::trust-project-code must be true, false or auto, not '$TRUST'"; exit 1 ;;
        esac
        # `pull_request_target` gives the job secrets and a token that can
        # write, also on PRs from forks: the PR's code must not run there.
        if [ "$EVENT" = "pull_request_target" ]; then
          if [ "$TRUST" = "true" ] || [ "$SEMVER_CHECKS" = "true" ]; then
            echo "::error::trust-project-code and semver-checks run the PR's code, so they are refused under pull_request_target."
            exit 1
          fi
        fi
        # `auto`: on under `pull_request`, whose token is read-only on PRs
        # from forks, and without a PR (on a push, the warm-up analyzes the
        # repository's own code). Off when another event analyzes a PR, e.g.
        # `pull_request_target`, or `workflow_dispatch` with `pr`: the
        # token may write there.
        if [ "$TRUST" = "auto" ]; then
          if [ "$EVENT" = "pull_request" ] || [ -z "$PR" ]; then
            TRUST=true
          else
            echo "::notice::trust-project-code is off: under $EVENT the token may be able to write, so the PR's code is not run unless trust-project-code is true. Calls into generated code stay unresolved."
            TRUST=false
          fi
        fi
        echo "trust=$TRUST" >> "$GITHUB_OUTPUT"
    # The toolchain for the analysis: rust-analyzer needs cargo and the
    # standard library's source, also when the tool itself comes from the
    # cache. Building the tool uses this repository's `rust-toolchain.toml`,
    # which adds the wasm target.
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rust-src
    # The built tool is cached under a hash of its sources, so a run whose
    # tool sources are unchanged (every run in a repository that only uses
    # the action) skips the build. The key holds the runner's OS and
    # architecture (the binary's target) and `rust-toolchain.toml` (the
    # toolchain it is built with). It leaves out the exact version of
    # `stable`: a binary built with an older one works the same, and
    # every new release would rebuild the tool.
    - name: Hash the tool's sources
      id: key
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        hash=$(find Cargo.toml Cargo.lock rust-toolchain.toml crates -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-20)
        echo "key=rust-semantic-review-bin-$RUNNER_OS-$RUNNER_ARCH-$hash" >> "$GITHUB_OUTPUT"
        echo "dir=$RUNNER_TEMP/rust-semantic-review-bin" >> "$GITHUB_OUTPUT"
        # The analysis' target directory (trusted mode) only fits the
        # toolchain that built it: the one of the analyzed checkout, not the
        # one this directory's `rust-toolchain.toml` names.
        echo "rustc=$(cd "$GITHUB_WORKSPACE" && rustc -V | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
        echo "target=$RUNNER_TEMP/rust-semantic-review-target" >> "$GITHUB_OUTPUT"
    - name: Restore the built tool
      id: bin
      if: inputs.cache == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
    # Otherwise build it. With `cache-dependencies`, dependencies come from
    # rust-cache. Caches are scoped to a branch, and a pull request can read
    # those of its base branch, so they are only saved there (see
    # `save-cache`): one cache that every PR starts from, instead of one per
    # PR evicting the others.
    - uses: Swatinem/rust-cache@v2
      if: inputs.cache == 'true' && inputs.cache-dependencies == 'true' && steps.bin.outputs.cache-hit != 'true'
      with:
        workspaces: ${{ github.action_path }} -> target
        shared-key: rust-semantic-review
        # Keeps the build script's output, which holds the viewer's own
        # wasm build and its dependencies.
        cache-workspace-crates: true
        save-if: ${{ inputs.save-cache }}
    - name: Build rust-semantic-review
      if: steps.bin.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        DIR: ${{ steps.key.outputs.dir }}
      run: |
        # Only for the analysis of this repository (see build.rs): the tool
        # itself needs its viewer.
        unset RUST_SEMANTIC_REVIEW_STUB_VIEWER RUST_PR_EXPLORER_STUB_VIEWER
        # See `[profile.action]` in Cargo.toml.
        cargo build --profile action --locked -p rust-semantic-review
        mkdir -p "$DIR"
        cp target/action/rust-semantic-review "$DIR/"
    - name: Cache the built tool
      if: inputs.cache == 'true' && steps.bin.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
    # In trusted mode, cargo builds the dependencies' build scripts and
    # proc macros for the analysis: most of a trusted run's time when they
    # aren't cached. Keyed by the checked out repository's lockfiles; a
    # PR whose dependencies differ starts from the default branch's
    # directory.
    # A prebuilt binary, in a few seconds instead of a 5 minute build.
    - name: Install cargo-semver-checks
      if: inputs.semver-checks == 'true' && inputs.pr != ''
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-semver-checks
    - name: Restore the analysis' target directory
      id: target
      if: steps.check.outputs.trust == 'true' && inputs.cache == 'true' && inputs.cache-target == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.key.outputs.target }}
        key: rust-semantic-review-target-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.rustc }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: rust-semantic-review-target-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.rustc }}-
    - name: Analyze the pull request
      id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ inputs.pr }}
        REPO: ${{ inputs.repository }}
        COMMENT: ${{ inputs.comment }}
        SYNTAX_ONLY: ${{ inputs.syntax-only }}
        SEMVER_CHECKS: ${{ inputs.semver-checks }}
        TRUST: ${{ steps.check.outputs.trust }}
        TARGET: ${{ steps.key.outputs.target }}
        FILL_TARGET: ${{ inputs.cache == 'true' && inputs.cache-target == 'true' && inputs.save-cache == 'true' && steps.target.outputs.cache-hit != 'true' }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        TOOL: ${{ steps.key.outputs.dir }}/rust-semantic-review
        REUSE: ${{ inputs.reuse-analysis }}
      run: |
        trusted=()
        if [ "$TRUST" = "true" ]; then trusted=(--trust-project-code --target-dir "$TARGET"); fi
        if [ -z "$PR" ]; then
          # E.g. a push to the default branch, run to fill the caches.
          if [ "$TRUST" = "true" ] && [ "$FILL_TARGET" = "true" ]; then
            # Analyzing the checked out repository builds what a PR's
            # analysis needs.
            echo "::notice::No pull request: filling the analysis' target directory from the checked out repository."
            "$TOOL" dirs "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" -o "$RUNNER_TEMP/warm-up.html" "${trusted[@]}"
          else
            echo "::notice::No pull request: the tool is built and cached, nothing else to do."
          fi
          exit 0
        fi
        dir="$RUNNER_TEMP/rust-semantic-review"
        mkdir -p "$dir"

        # The latest Rust Semantic Review comment on the PR, if any, says which
        # commit it showed: the page of the changes since then starts there.
        prev=
        if [ "$COMMENT" != "false" ]; then
          "$GITHUB_ACTION_PATH/action/previous-comment.sh" "$dir"
          prev=$(cat "$dir/previous-head")
        fi

        # The tool clones the repository itself. Authenticate that clone for
        # this step only (private repositories), the way actions/checkout
        # does, without writing the token to any git config file.
        auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
        echo "::add-mask::$auth"
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
        export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"

        short=${HEAD_SHA:0:7}
        # The artifact is named after the file, so the name must be unique
        # per run.
        page="$dir/rust-semantic-review-${PR}${short:+-$short}.html"
        args=()
        if [ "$SYNTAX_ONLY" = "true" ]; then args+=(--syntax-only); fi
        # Runs the PR's code too (see "Check the inputs").
        if [ "$SEMVER_CHECKS" = "true" ]; then args+=(--semver-checks); fi
        if [ -n "$prev" ] && [ "$prev" != "$HEAD_SHA" ]; then
          args+=(--since "$prev")
          # The previous run's analysis of that commit, if it may be used
          # (see action/previous-analysis.sh).
          if [ "$REUSE" = "true" ]; then
            PREVIOUS=$prev "$GITHUB_ACTION_PATH/action/previous-analysis.sh" "$dir"
            if [ -f "$dir/since-analysis.json.gz" ]; then args+=(--since-analysis "$dir/since-analysis.json.gz"); fi
          fi
        fi
        # For the next run's page of the changes since this one's comment.
        if [ "$REUSE" = "true" ] && [ "$COMMENT" != "false" ]; then
          mkdir -p "$dir/analysis"
          args+=(--save-head-analysis "$dir/analysis/head-analysis.json.gz")
        fi
        # Without trust-project-code and semver-checks, the PR's code is never
        # built or run.
        # The page's permalinks point at its artifact in this run.
        args+=(--run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
        "$TOOL" pr "$REPO#$PR" -o "$page" --json "$dir/analysis.json" "${args[@]}" "${trusted[@]}" > "$dir/stdout"
        since=$(sed -n 's/^since: //p' "$dir/stdout" | tail -n1)
        reused=$(sed -n 's/^since-analysis: //p' "$dir/stdout" | tail -n1)
        if [ -n "$reused" ]; then echo "::notice::The previous run's analysis of $prev: $reused"; fi

        # A short summary for the comment (see action/counts.jq).
        jq -f "$GITHUB_ACTION_PATH/action/counts.jq" "$dir/analysis.json" > "$dir/counts.json"
        if [ "$since" = "changes" ]; then
          jq -f "$GITHUB_ACTION_PATH/action/counts.jq" "$dir/analysis-since.json" > "$dir/since-counts.json"
        fi
        summarize() { jq -r -f "$GITHUB_ACTION_PATH/action/summary.jq" "$1"; }
        head=$(jq -r '.meta.pr.head_commit // ""' "$dir/analysis.json")
        if [ "$COMMENT" != "false" ]; then
          # What the comment-only action (`comment/`) needs besides what it
          # reads from the API itself. It treats all of it as untrusted.
          mkdir -p "$dir/comment"
          jq -n --argjson pr "$PR" --arg head "$head" --arg previous "$prev" --arg since "$since" \
            --slurpfile counts "$dir/counts.json" \
            --argjson since_counts "$(cat "$dir/since-counts.json" 2>/dev/null || echo null)" \
            '{version: 1, $pr, $head, $previous, $since, counts: $counts[0], $since_counts}' \
            > "$dir/comment/rust-semantic-review-comment.json"
        fi
        {
          echo "page=$page"
          echo "summary=$(summarize "$dir/counts.json")"
          echo "counts=$(jq -c . "$dir/counts.json")"
          echo "head=$head"
          echo "previous=$prev"
          # `changes`, `none` or `unavailable (why)`; empty without --since.
          echo "since=$since"
          if [ "$since" = "changes" ]; then
            echo "since-page=${page%.html}-since.html"
            echo "since-summary=$(summarize "$dir/since-counts.json")"
          fi
          if [ -f "$dir/previous-id" ]; then
            echo "previous-id=$(cat "$dir/previous-id")"
            echo "previous-node-id=$(cat "$dir/previous-node-id")"
            echo "previous-state=$(cat "$dir/previous.json")"
          fi
          if [ "$COMMENT" != "false" ]; then echo "comment-dir=$dir/comment"; fi
          if [ -s "$dir/analysis/head-analysis.json.gz" ]; then echo "analysis=$dir/analysis/head-analysis.json.gz"; fi
        } >> "$GITHUB_OUTPUT"
    - name: Cache the analysis' target directory
      if: steps.check.outputs.trust == 'true' && inputs.cache == 'true' && inputs.cache-target == 'true' && inputs.save-cache == 'true' && steps.target.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.key.outputs.target }}
        key: ${{ steps.target.outputs.cache-primary-key }}
    - name: Upload the page
      id: upload
      if: steps.run.outputs.page != ''
      uses: actions/upload-artifact@v7
      with:
        path: ${{ steps.run.outputs.page }}
        # A single unzipped file: GitHub shows it directly in the browser.
        # The page is self-contained (styles, script, wasm and data inline).
        archive: false
        retention-days: ${{ inputs.retention-days }}
    - name: Upload the page of the changes since the last comment
      id: upload-since
      if: steps.run.outputs.since-page != ''
      uses: actions/upload-artifact@v7
      with:
        path: ${{ steps.run.outputs.since-page }}
        archive: false
        retention-days: ${{ inputs.retention-days }}
    - name: Upload the analysis for the next run
      if: steps.run.outputs.analysis != ''
      uses: actions/upload-artifact@v7
      with:
        # previous-analysis.sh looks for it by this name.
        name: rust-semantic-review-analysis
        path: ${{ steps.run.outputs.analysis }}
        # Gzipped already.
        compression-level: 0
        retention-days: ${{ inputs.retention-days }}
    - name: Link the page
      id: link
      if: steps.run.outputs.page != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ inputs.pr }}
        REPO: ${{ inputs.repository }}
        POST: ${{ inputs.comment == 'true' }}
        UPDATE_COMMENT: ${{ inputs.update-comment }}
        URL: ${{ steps.upload.outputs.artifact-url }}
        SUMMARY: ${{ steps.run.outputs.summary }}
        COUNTS: ${{ steps.run.outputs.counts }}
        HEAD: ${{ steps.run.outputs.head }}
        PREVIOUS: ${{ steps.run.outputs.previous }}
        PREVIOUS_ID: ${{ steps.run.outputs.previous-id }}
        PREVIOUS_NODE_ID: ${{ steps.run.outputs.previous-node-id }}
        PREVIOUS_STATE: ${{ steps.run.outputs.previous-state }}
        SINCE: ${{ steps.run.outputs.since }}
        SINCE_URL: ${{ steps.upload-since.outputs.artifact-url }}
        ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        SINCE_ARTIFACT_ID: ${{ steps.upload-since.outputs.artifact-id }}
        RETENTION_DAYS: ${{ inputs.retention-days }}
        SINCE_SUMMARY: ${{ steps.run.outputs.since-summary }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RUN_ID: ${{ github.run_id }}
      run: '"$GITHUB_ACTION_PATH/action/post-comment.sh"'
    - name: Upload the data for the comment
      # With `workflow-run`, and with `true` when this run's token could not
      # comment (a PR from a fork or by Dependabot): then a workflow with
      # the comment-only action posts it, if the repository has one.
      if: steps.run.outputs.comment-dir != '' && (inputs.comment == 'workflow-run' || steps.link.outputs.posted == 'false')
      uses: actions/upload-artifact@v7
      with:
        # The comment-only action looks for it by this name.
        name: rust-semantic-review-comment
        path: ${{ steps.run.outputs.comment-dir }}
        retention-days: ${{ inputs.retention-days }}
